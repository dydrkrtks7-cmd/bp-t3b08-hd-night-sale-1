    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #ff2d55;
            --accent-hover: #ff4d6a;
            --border: #333333;
            --border-accent: #ff2d55;
            --neon-glow: 0 0 10px rgba(255, 45, 85, 0.3);
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: 'Arial', 'Helvetica', sans-serif;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 2rem;
            --spacing-xl: 4rem;
            --max-width: 1200px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-mono);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: 2.5rem;
            line-height: 1.1;
            margin-bottom: var(--spacing-lg);
            text-transform: uppercase;
            border-left: 4px solid var(--accent);
            padding-left: var(--spacing-md);
        }

        h2 {
            font-size: 1.75rem;
            margin-bottom: var(--spacing-md);
            color: var(--accent);
        }

        h3 {
            font-size: 1.2rem;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        p {
            margin-bottom: var(--spacing-md);
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        a:hover {
            border-bottom-color: var(--accent);
        }

        img, svg {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .nav-toggle {
            display: none;
        }

        .nav-toggle-label {
            display: none;
            cursor: pointer;
            position: fixed;
            top: var(--spacing-md);
            right: var(--spacing-md);
            z-index: 1001;
            padding: var(--spacing-sm);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
        }

        .nav-toggle-label span,
        .nav-toggle-label span::before,
        .nav-toggle-label span::after {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text-primary);
            transition: all 0.3s ease;
        }

        .nav-toggle-label span {
            position: relative;
        }

        .nav-toggle-label span::before,
        .nav-toggle-label span::after {
            content: '';
            position: absolute;
            left: 0;
        }

        .nav-toggle-label span::before { top: -8px; }
        .nav-toggle-label span::after { top: 8px; }

        .nav-toggle:checked ~ .nav-toggle-label span {
            background: transparent;
        }

        .nav-toggle:checked ~ .nav-toggle-label span::before {
            top: 0;
            transform: rotate(45deg);
        }

        .nav-toggle:checked ~ .nav-toggle-label span::after {
            top: 0;
            transform: rotate(-45deg);
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--spacing-md) var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            border: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .nav-logo:hover {
            border: none;
            opacity: 0.8;
        }

        .nav-links {
            display: flex;
            gap: var(--spacing-lg);
            list-style: none;
        }

        .nav-links a {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border: none;
            padding: var(--spacing-xs) 0;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a.active {
            color: var(--accent);
        }

        .nav-links a.active::after {
            width: 100%;
        }

        .tel-link {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-family: var(--font-mono);
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem;
            border: 1px solid var(--accent);
            padding: var(--spacing-xs) var(--spacing-md);
            transition: all 0.3s ease;
        }

        .tel-link:hover {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .tel-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-lg);
        }

        .hero-section {
            margin-bottom: var(--spacing-xl);
            padding: var(--spacing-xl) 0;
            border-bottom: 2px solid var(--border);
        }

        .hero-section h1 {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
        }

        .hero-section p {
            font-size: 1.1rem;
            max-width: 800px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: var(--spacing-lg);
            position: relative;
            transition: border-color 0.3s ease;
        }

        .info-card:hover {
            border-color: var(--accent);
        }

        .info-card h3 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 1px solid var(--border);
        }

        .info-card ul {
            list-style: none;
            padding: 0;
        }

        .info-card li {
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .info-card li:last-child {
            border-bottom: none;
        }

        .info-card li strong {
            color: var(--text-primary);
            display: inline-block;
            min-width: 100px;
        }

        .data-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
        }

        .data-section h2 {
            margin-bottom: var(--spacing-lg);
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-lg);
        }

        .data-item {
            text-align: center;
            padding: var(--spacing-lg);
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .data-item .number {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            display: block;
            margin-bottom: var(--spacing-sm);
        }

        .data-item .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .faq-section {
            margin-bottom: var(--spacing-xl);
        }

        .faq-section h2 {
            margin-bottom: var(--spacing-lg);
        }

        .faq-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            margin-bottom: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
        }

        .faq-item h3 {
            font-size: 0.95rem;
            cursor: pointer;
            position: relative;
            padding-right: 2rem;
        }

        .faq-item h3::after {
            content: '+';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 1.2rem;
        }

        .faq-item p {
            margin-top: var(--spacing-sm);
            padding-top: var(--spacing-sm);
            border-top: 1px solid var(--border);
            display: none;
        }

        .faq-item.active p {
            display: block;
        }

        .faq-item.active h3::after {
            content: '−';
        }

        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: var(--spacing-xl) var(--spacing-lg);
            text-align: center;
        }

        footer p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            max-width: var(--max-width);
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .nav-toggle-label {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 250px;
                height: 100vh;
                background: var(--bg-secondary);
                flex-direction: column;
                padding: var(--spacing-xl) var(--spacing-lg);
                transition: right 0.3s ease;
                border-left: 1px solid var(--border);
                gap: var(--spacing-md);
                z-index: 1000;
            }

            .nav-toggle:checked ~ .nav-links {
                right: 0;
            }

            .nav-links a {
                font-size: 1rem;
                padding: var(--spacing-sm) 0;
            }

            h1 {
                font-size: 1.8rem;
            }

            .hero-section h1 {
                font-size: 2rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .data-grid {
                grid-template-columns: 1fr;
            }

            .tel-link {
                font-size: 0.9rem;
                padding: var(--spacing-xs) var(--spacing-sm);
            }

            main {
                padding: var(--spacing-lg) var(--spacing-md);
            }
        }
    </style>
